<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <title>Crear cuenta</title>
</head>
<body>
  <header>
     <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
          <img src="imagenes/logo.png"alt="CaramelSweet Logo" style="height: 55px; width: auto;">
          <span style="font-family:'Cormorant Garamond',serif; 
                       font-size:22px; 
                       letter-spacing:3px; 
                       color:#1A1A1A;">
            CARAMELSWEET
          </span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="iniciarsesion.html">Iniciar sesión</a></li>
            <li class="nav-item"><a class="nav-link" href="ofertas.html">Ofertas</a></li>
            <li class="nav-item"><a class="nav-link" href="recomendaciones.html">Recomendaciones</a></li>
            <li class="nav-item"><a class="nav-link" href="contactanos.html">Contáctanos</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h2 class="card-title text-center mb-4">Crear cuenta</h2>
            <form id="registerForm" class="needs-validation" novalidate>
              <div class="mb-3">
                <label for="name" class="form-label">Nombre completo</label>
                <input type="text" class="form-control" id="name" placeholder="Tu nombre completo" required>
                <div class="invalid-feedback">Por favor ingresa tu nombre completo.</div>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" placeholder="usuario@ejemplo.com" required>
                <div class="invalid-feedback">Por favor ingresa un correo válido.</div>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="Crea una contraseña" required>
                <div class="invalid-feedback">Por favor ingresa una contraseña.</div>
              </div>
              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Repite la contraseña" required>
                <div class="invalid-feedback">Las contraseñas deben coincidir.</div>
              </div>
              <button type="submit" class="btn btn-primary w-100">Registrarse</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('registerForm');
      const password = document.getElementById('password');
      const confirmPassword = document.getElementById('confirmPassword');

      function validatePasswordMatch() {
        if (password.value && confirmPassword.value && password.value !== confirmPassword.value) {
          confirmPassword.setCustomValidity('Las contraseñas no coinciden');
        } else {
          confirmPassword.setCustomValidity('');
        }
      }

      password.addEventListener('input', validatePasswordMatch);
      confirmPassword.addEventListener('input', validatePasswordMatch);

      form.addEventListener('submit', function (event) {
        validatePasswordMatch();
        if (!form.checkValidity()) {
          event.preventDefault();
          event.stopPropagation();
          form.classList.add('was-validated');
          return;
        }

        event.preventDefault();
        alert('La cuenta fue creada correctamente');
        form.reset();
        form.classList.remove('was-validated');
      });
    });
  </script>
</body>
</html>
