<html lang="es">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/styles.css">
    <title>Iniciar sesión</title>
</head>
<body>
  <header>
     <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
          <img src="imagenes/logo.png" alt="CaramelSweet Logo" style="height: 55px; width: auto;">
          <span style="font-family:'Cormorant Garamond',serif; 
                       font-size:22px; 
                       letter-spacing:3px; 
                       color:#1A1A1A;">
            CARAMELSWEET
          </span>
        </a>
        <button class="navbar-toggler" type="button" 
                data-bs-toggle="collapse" 
                data-bs-target="#navbarNav" 
                aria-controls="navbarNav" 
                aria-expanded="false" 
                aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="iniciarsesion.html">Iniciar sesión</a></li>
            <li class="nav-item"><a class="nav-link" href="ofertas.html">Ofertas</a></li>
            <li class="nav-item"><a class="nav-link" href="categorias.html">Categorías</a></li>
            <li class="nav-item"><a class="nav-link" href="recomendaciones.html">Recomendaciones</a></li>
            <li class="nav-item"><a class="nav-link" href="contactanos.html">Contáctanos</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h2 class="card-title text-center mb-4">Iniciar sesión</h2>
            <form>
              <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" placeholder="usuario@ejemplo.com" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="Escribe tu contraseña" required>
              </div>
              <button type="submit" class="btn btn-primary w-100 mb-3">Entrar</button>
            </form>
            <div class="text-center">
              <p class="mb-1">¿Aún no tienes cuenta?</p>
              <a href="crearcuenta.html" class="btn btn-outline-secondary w-100">Crear cuenta</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
